<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Friendship Day Nakti ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#ff4d6d,#ff9a9e,#fad0c4);
overflow-x:hidden;
color:white;
text-align:center;

}

canvas{
position:fixed;
top:0;
left:0;
z-index:-2;
}

.overlay{

position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.35);
z-index:-1;

}

.container{

width:100%;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;

}

h1{

font-size:52px;
margin-bottom:15px;
animation:fadeDown 1.2s;

}

.type{

font-size:22px;
width:90%;
max-width:800px;
line-height:38px;

}

.slider{

margin-top:45px;
width:330px;
height:430px;
border-radius:25px;
overflow:hidden;
box-shadow:0 20px 45px rgba(0,0,0,.45);
position:relative;

}

.slider img{

position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:1.2s;

}

.slider img.active{

opacity:1;

}

.card{

margin-top:35px;
width:90%;
max-width:700px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(12px);
padding:25px;
border-radius:20px;
font-size:20px;
line-height:35px;

}

.btn{

margin-top:40px;
padding:15px 45px;
border:none;
border-radius:50px;
background:white;
color:#ff2d55;
font-size:18px;
cursor:pointer;
font-weight:bold;
transition:.4s;

}

.btn:hover{

transform:scale(1.08);

}

.final{

display:none;
min-height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
padding:40px;

}

.final h2{

font-size:48px;
margin-bottom:25px;

}

.final p{

font-size:24px;
line-height:42px;
max-width:800px;

}

.heart{

position:fixed;
font-size:25px;
animation:float 7s linear infinite;

}

@keyframes float{

0%{
transform:translateY(100vh);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

@keyframes fadeDown{

from{
opacity:0;
transform:translateY(-50px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:700px){

h1{

font-size:34px;

}

.type{

font-size:18px;

}

.slider{

width:90%;
height:420px;

}

.card{

font-size:18px;

}

.final h2{

font-size:32px;

}

.final p{

font-size:18px;

}

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="container">

<h1>❤️ Happy Friendship Day Nakti ❤️</h1>

<div class="type" id="typing"></div>

<div class="slider">

<img src="WhatsApp Image 2026-08-01 at 10.54.42 PM (1).jpeg" class="active">
<img src="WhatsApp Image 2026-08-01 at 10.54.42 PM.jpeg">
<img src="WhatsApp Image 2026-08-01 at 10.54.43 PM (1).jpeg">
<img src="WhatsApp Image 2026-08-01 at 10.54.43 PM.jpeg">
<img src="WhatsApp Image 2026-08-01 at 10.54.42 PM (2).jpeg">

</div>

<div class="card" id="message">

Best Friend...❤️

</div>

<button class="btn" onclick="showFinal()">

Open Final Surprise 🎁

</button>

</div>

<div class="final" id="final">

<h2>💖 Thank You Nakti 💖</h2>

<p id="finalText"></p>

</div>
